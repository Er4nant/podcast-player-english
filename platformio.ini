; Podcast RSS 在线播放器 — 双目标固件
; - cardputer-adv-podcast : M5Stack Cardputer ADV（键盘输入 / SD 卡换频道）
; - m5stick-s3-podcast    : M5Stack StickS3（双键输入 / RSS 写死单频道）
;
; 产物是单个应用固件 bin（post 脚本按环境复制到 dist/），
; 通过 M5Launcher / M5Burner 烧写。应用不依赖 NVS/SPIFFS/SD 内容，
; 因此对 Launcher 的分区布局无要求。

[platformio]
default_envs = cardputer-adv-podcast

[env:cardputer-adv-podcast]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
; 本机 PIO registry CDN 不可靠，统一用 GitHub tag 源（与根工程做法一致）
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.33
    https://github.com/m5stack/M5Unified.git#0.2.26
    https://github.com/m5stack/M5Cardputer.git#1.1.1
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    https://github.com/leethomason/tinyxml2.git#9.0.0
extra_scripts = pre:tools/gen_channels.py, pre:tools/patch_audio_stack.py, pre:tools/pio_windows_compat.py, post:tools/deploy_dist.py
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder   ; 串口日志自动把崩溃 Backtrace 解码成函数名

[env:m5stick-s3-podcast]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi   ; StickS3 为 OPI PSRAM（8MB）
board_build.partitions = default_8MB.csv
build_flags =
    -DPODCAST_TARGET_STICKS3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.33
    https://github.com/m5stack/M5Unified.git#0.2.26
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    https://github.com/leethomason/tinyxml2.git#9.0.0
extra_scripts = pre:tools/gen_channels.py, pre:tools/patch_audio_stack.py, pre:tools/pio_windows_compat.py, post:tools/deploy_dist.py
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
