; Podcast RSS online player — dual-target firmware
; - cardputer-adv-podcast : M5Stack Cardputer ADV (keyboard input / channel switching via SD card)
; - m5stick-s3-podcast    : M5Stack StickS3 (two-button input / single channel hardcoded via RSS)
;
; The output is a single application firmware bin (the post script copies it to dist/ per environment),
; flashed via M5Launcher / M5Burner. The app does not depend on NVS/SPIFFS/SD contents,
; so it has no requirements on the Launcher's partition layout.

[platformio]
default_envs = cardputer-adv-podcast

[env:cardputer-adv-podcast]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
; The local PIO registry CDN is unreliable, so use GitHub tag sources uniformly (consistent with the root project)
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.33
    https://github.com/m5stack/M5Unified.git#0.2.26
    https://github.com/m5stack/M5Cardputer.git#1.1.1
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    https://github.com/leethomason/tinyxml2.git#9.0.0
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
extra_scripts = pre:tools/gen_channels.py, pre:tools/patch_audio_stack.py, pre:tools/pio_windows_compat.py, post:tools/deploy_dist.py
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder   ; automatically decode crash backtraces into function names in the serial log

[env:m5stick-s3-podcast]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi   ; StickS3 has OPI PSRAM (8MB)
board_build.partitions = default_8MB.csv
build_flags =
    -DPODCAST_TARGET_STICKS3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.33
    https://github.com/m5stack/M5Unified.git#0.2.26
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    https://github.com/leethomason/tinyxml2.git#9.0.0
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
extra_scripts = pre:tools/gen_channels.py, pre:tools/patch_audio_stack.py, pre:tools/pio_windows_compat.py, post:tools/deploy_dist.py
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
